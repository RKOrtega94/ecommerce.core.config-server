spring.application.name=config-server
server.port=${SERVER_PORT:8888}
# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true
# Spring Cloud Config Server Git properties
spring.cloud.config.server.bootstrap=true
spring.cloud.config.server.git.uri=https://github.com/${GITHUB_ORG}/${GITHUB_REPO}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.search-paths=${GITHUB_SEARCH_PATHS}
spring.cloud.config.server.git.default-label=${GIT_BRANCH:main}
spring.cloud.config.server.git.username=${GIT_USERNAME:}
spring.cloud.config.server.git.password=${GIT_PASSWORD:}
spring.cloud.config.server.git.ignore-local-ssh-settings=true
# Actuator properties
management.endpoints.web.base-path=/health/${spring.application.name}
management.endpoints.web.path-mapping.health=status
management.endpoints.web.exposure.include=*
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.access=UNRESTRICTED
spring.docker.compose.enabled=false